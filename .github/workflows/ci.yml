name: CI/CD Build and Deploy to Easypanel

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Detect changes (global + affected)
        id: changes
        run: |
          echo "Checking global changes..."

          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -qE "nx.json|package.json|tsconfig.base.json"; then
            echo "GLOBAL_CHANGED=true" >> $GITHUB_ENV
            echo "Global config changed"
          else
            echo "GLOBAL_CHANGED=false" >> $GITHUB_ENV
          echo "No global config changes"
          fi

          echo "Calculating affected projects..."
          npx nx show projects --affected --base=${{ github.event.before }} --head=${{ github.sha }} > affected.txt

          echo "Affected projects:"
          cat affected.txt

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- FRONTEND ---
      - name: Build & Push Frontend
        run: |
          if [ "$GLOBAL_CHANGED" = "true" ] || grep -q "gestormatic-frontend" affected.txt; then
            echo "Building frontend..."

            IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}-frontend" | tr '[:upper:]' '[:lower:]')

            docker build -t $IMAGE_ID:latest -f docker/gestormatic-frontend/Dockerfile .
            docker push $IMAGE_ID:latest
            curl -X POST "${{ secrets.EASYPANEL_WEBHOOK_FRONTEND }}"
          else
            echo "Frontend not affected, skipping..."
          fi

      # --- BACKEND: LOGIN ---
      - name: Build & Push Login Service
        run: |
          if [ "$GLOBAL_CHANGED" = "true" ] || grep -q "process-mgmt-login" affected.txt; then
            echo "Building login service..."

            IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}-login" | tr '[:upper:]' '[:lower:]')

            docker build -t $IMAGE_ID:latest -f docker/gestormatic-backend/process-mgmt-login/Dockerfile .
            docker push $IMAGE_ID:latest
            curl -X POST "${{ secrets.EASYPANEL_WEBHOOK_BACKEND }}"
          else
            echo "Login service not affected, skipping..."
          fi

      # --- BACKEND: PROCEDURES ---
      - name: Build & Push Procedures Service
        run: |
          if [ "$GLOBAL_CHANGED" = "true" ] || grep -q "process-mgmt-procedures" affected.txt; then
            echo "Building procedures service..."

            IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}-procedures" | tr '[:upper:]' '[:lower:]')

            docker build -t $IMAGE_ID:latest -f docker/gestormatic-backend/process-mgmt-procedures/Dockerfile .
            docker push $IMAGE_ID:latest
            curl -X POST "${{ secrets.EASYPANEL_WEBHOOK_PROCEDURES }}"
          else
            echo "Procedures service not affected, skipping..."
          fi

      # --- SLACK NOTIFICATION ---
      - name: Notify on Slack
        if: always()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_BRANCH: ${{ github.ref }}
        run: |
          AFFECTED=$(paste -sd, affected.txt)
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          CLEAN_MSG=$(echo "$COMMIT_MESSAGE" | head -n 1 | sed 's/"/\\"/g' | tr -d '\n\r')
          COMMIT_LINK="<https://github.com/${{ github.repository }}/commit/$COMMIT_SHA|$SHORT_SHA>"
          AUTHOR_LINK="<https://github.com/${{ github.actor }}|${COMMIT_AUTHOR}>"
          BRANCH_LINK="<https://github.com/${{ github.repository }}/tree/${{ github.ref }}|${COMMIT_BRANCH}>"

          if [ -z "$AFFECTED" ]; then
            AFFECTED="None (No projects affected)"
          fi

          MESSAGE="🚀 *Deploy Job Status*\n*Affected Projects:* $AFFECTED\n*Commit:* $COMMIT_LINK - $CLEAN_MSG\n*Author:* $AUTHOR_LINK\n*Branch:* $BRANCH_LINK"

          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"$MESSAGE\"}" \
          ${{ secrets.SLACK_WEBHOOK_NOTIFICATIONS }}
