name: CI/CD Build and Deploy to Easypanel

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para que Nx detecte cambios

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- FRONTEND: GESTORMATIC-FRONTEND ---
      - name: Build & Push Frontend
        run: |
          if npx nx show projects --affected --base=origin/develop~1 --head=HEAD | grep -q "gestormatic-frontend"; then
            # Esta línea convierte el nombre del repositorio a minúsculas
            IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}-frontend" | tr '[:upper:]' '[:lower:]')

            docker build -t $IMAGE_ID:latest -f docker/gestormatic-frontend/Dockerfile .
            docker push $IMAGE_ID:latest
            curl -X POST "${{ secrets.EASYPANEL_WEBHOOK_FRONTEND }}"
          fi

      # --- BACKEND: PROCESS-MGMT-LOGIN ---
      - name: Build & Push Login Service
        run: |
          if npx nx show projects --affected --base=origin/develop~1 --head=HEAD | grep -q "process-mgmt-login"; then
            # Aplicamos lo mismo para el backend
            IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}-login" | tr '[:upper:]' '[:lower:]')

            docker build -t $IMAGE_ID:latest -f docker/gestormatic-backend/process-mgmt-login/Dockerfile .
            docker push $IMAGE_ID:latest
            curl -X POST "${{ secrets.EASYPANEL_WEBHOOK_BACKEND }}"
          fi

      # --- BACKEND: PROCESS-MGMT-PROCEDURES ---
      - name: Build & Push Procedures Service
        run: |
          if npx nx show projects --affected --base=origin/develop~1 --head=HEAD | grep -q "process-mgmt-procedures"; then
            # Aplicamos lo mismo para el backend (Procedures)
            IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}-procedures" | tr '[:upper:]' '[:lower:]')

            docker build -t $IMAGE_ID:latest -f docker/gestormatic-backend/process-mgmt-procedures/Dockerfile .
            docker push $IMAGE_ID:latest
            curl -X POST "${{ secrets.EASYPANEL_WEBHOOK_PROCEDURES }}"
          fi

      # --- NOTIFICATION: SLACK ---
      - name: Notify on Slack
        if: always()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_BRANCH: ${{ github.ref }}
        run: |
          AFFECTED=$(npx nx show projects --affected --base=origin/develop~1 --head=HEAD | paste -sd, -)
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          # Clean commit message for JSON and get only first line
          CLEAN_MSG=$(echo "$COMMIT_MESSAGE" | head -n 1 | sed 's/"/\\"/g' | tr -d '\n\r')
          COMMIT_LINK="<https://github.com/${{ github.repository }}/commit/$COMMIT_SHA|$SHORT_SHA>"
          AUTHOR_LINK="<https://github.com/${{ github.actor }}|${COMMIT_AUTHOR}>"
          BRANCH_LINK="<https://github.com/${{ github.repository }}/tree/${{ github.ref }}|${COMMIT_BRANCH}>"

          if [ -z "$AFFECTED" ]; then
            MESSAGE="🚀 Deploy job completed. No projects were affected.\n*Commit:* $COMMIT_LINK - $CLEAN_MSG\n*Author:* $AUTHOR_LINK\n*Branch:* $BRANCH_LINK"
          else
            MESSAGE="🚀 Deploy job completed. Affected projects: $AFFECTED\n*Commit:* $COMMIT_LINK - $CLEAN_MSG\n*Author:* $AUTHOR_LINK\n*Branch:* $BRANCH_LINK"
          fi
          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"$MESSAGE\"}" ${{ secrets.SLACK_WEBHOOK_NOTIFICATIONS }}
