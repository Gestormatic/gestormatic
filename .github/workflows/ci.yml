name: CI/CD Build and Deploy to Easypanel

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_projects: ${{ steps.set-matrix.outputs.has_projects }}
      affected: ${{ steps.set-matrix.outputs.affected }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Detect changes
        id: set-matrix
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed.txt
          cat changed.txt

          if grep -qE "^apps/|^libs/" changed.txt; then
            AFFECTED=$(npx nx show projects --affected --base=${{ github.event.before }} --head=${{ github.sha }})

            MATRIX=$(echo "$AFFECTED" | jq -R -s -c 'split("\n") | map(select(length > 0))')

            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
            echo "has_projects=true" >> $GITHUB_OUTPUT

            echo "affected<<EOF" >> $GITHUB_OUTPUT
            echo "$AFFECTED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_projects=false" >> $GITHUB_OUTPUT
            echo "affected=" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_projects == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}" >> $GITHUB_ENV

      - name: Set tags
        run: |
          echo "TAG_LATEST=${IMAGE}:latest" >> $GITHUB_ENV
          echo "TAG_SHA=${IMAGE}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Generate version
        run: |
          VERSION="v$(date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build & Push
        run: |
          PROJECT="${{ matrix.project }}"

          if [ "$PROJECT" = "gestormatic-frontend" ]; then  
            DOCKERFILE="apps/gestormatic-frontend/docker/Dockerfile"
            WEBHOOK="${{ secrets.EASYPANEL_WEBHOOK_FRONTEND }}"

          elif [ "$PROJECT" = "process-mgmt-login" ]; then
            DOCKERFILE="apps/gestormatic-backend/process-mgmt-login/docker/Dockerfile"
            WEBHOOK="${{ secrets.EASYPANEL_WEBHOOK_BACKEND }}"

          elif [ "$PROJECT" = "process-mgmt-procedures" ]; then
            DOCKERFILE="apps/gestormatic-backend/process-mgmt-procedures/docker/Dockerfile"
            WEBHOOK="${{ secrets.EASYPANEL_WEBHOOK_PROCEDURES }}"
          else
            echo "Skipping $PROJECT"
            exit 0
          fi

          echo "Building $PROJECT..."

          docker buildx build \
            --push \
            --tag $TAG_LATEST \
            --tag $TAG_SHA \
            --tag ${IMAGE}:$VERSION \
            -f $DOCKERFILE \
            .

          echo "Deploying..."
          curl -X POST "$WEBHOOK"

          echo "${{ github.sha }}" > deployed-${PROJECT}.txt

      - name: Upload deployed version
        uses: actions/upload-artifact@v4
        with:
          name: deployed-${{ matrix.project }}
          path: deployed-${{ matrix.project }}.txt

  notify:
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.has_projects == 'true'

    steps:
      - name: Slack notify
        env:
          AFFECTED: ${{ needs.detect-changes.outputs.affected }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          STATUS="✅ SUCCESS"

          if [ "${{ needs.build.result }}" != "success" ]; then
            STATUS="❌ FAILED"
          fi

          MESSAGE="$STATUS Deploy
          Projects:
          $AFFECTED

          Commit:
          $COMMIT_MESSAGE"

          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"🚀 $MESSAGE\"}" \
          ${{ secrets.SLACK_WEBHOOK_NOTIFICATIONS }}
