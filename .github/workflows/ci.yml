name: CI/CD Build and Deploy to Easypanel

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_projects: ${{ steps.set-matrix.outputs.has_projects }}
      affected: ${{ steps.set-matrix.outputs.affected }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Detect changes and affected projects
        id: set-matrix
        run: |
          echo "Detecting changed files..."
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed_files.txt
          cat changed_files.txt

          # Detect if project files changed (apps/libs)
          if grep -qE "^apps/|^libs/" changed_files.txt; then
            PROJECT_CHANGED=true
          else
            PROJECT_CHANGED=false
          fi

          echo "PROJECT_CHANGED=$PROJECT_CHANGED"

          if [ "$PROJECT_CHANGED" = "true" ]; then
            echo "Calculating affected projects..."

            AFFECTED=$(npx nx show projects --affected --base=${{ github.event.before }} --head=${{ github.sha }})

            echo "Affected projects:"
            echo "$AFFECTED"

            MATRIX=$(echo "$AFFECTED" | jq -R -s -c 'split("\n") | map(select(length > 0))')

            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
            echo "has_projects=true" >> $GITHUB_OUTPUT
            echo "affected=$AFFECTED" >> $GITHUB_OUTPUT
          else
            echo "Only global changes → skipping builds"

            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_projects=false" >> $GITHUB_OUTPUT
            echo "affected=" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_projects == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log project
        run: echo "Building ${{ matrix.project }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push
        run: |
          PROJECT="${{ matrix.project }}"
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}-$PROJECT" | tr '[:upper:]' '[:lower:]')

          if [ "$PROJECT" = "gestormatic-frontend" ]; then
            docker build -t $IMAGE_ID:latest -f docker/gestormatic-frontend/Dockerfile .
            docker push $IMAGE_ID:latest
            curl -X POST "${{ secrets.EASYPANEL_WEBHOOK_FRONTEND }}"

          elif [ "$PROJECT" = "process-mgmt-login" ]; then
            docker build -t $IMAGE_ID:latest -f docker/gestormatic-backend/process-mgmt-login/Dockerfile .
            docker push $IMAGE_ID:latest
            curl -X POST "${{ secrets.EASYPANEL_WEBHOOK_BACKEND }}"

          elif [ "$PROJECT" = "process-mgmt-procedures" ]; then
            docker build -t $IMAGE_ID:latest -f docker/gestormatic-backend/process-mgmt-procedures/Dockerfile .
            docker push $IMAGE_ID:latest
            curl -X POST "${{ secrets.EASYPANEL_WEBHOOK_PROCEDURES }}"
          else
            echo "Skipping unknown project: $PROJECT"
          fi

  notify:
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.has_projects == 'true'

    steps:
      - name: Send Slack notification
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_BRANCH: ${{ github.ref }}
          AFFECTED: ${{ needs.detect-changes.outputs.affected }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          CLEAN_MSG=$(echo "$COMMIT_MESSAGE" | head -n 1 | sed 's/"/\\"/g' | tr -d '\n\r')
          COMMIT_LINK="<https://github.com/${{ github.repository }}/commit/$COMMIT_SHA|$SHORT_SHA>"
          AUTHOR_LINK="<https://github.com/${{ github.actor }}|${COMMIT_AUTHOR}>"
          BRANCH_LINK="<https://github.com/${{ github.repository }}/tree/${{ github.ref }}|${COMMIT_BRANCH}>"

          if [ -z "$AFFECTED" ]; then
            AFFECTED="None (No projects affected)"
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            STATUS="❌ FAILED"
          else
            STATUS="✅ SUCCESS"
          fi

          MESSAGE="$STATUS *🚀 Deploy Job*\n*Affected Projects:* $AFFECTED\n*Commit:* $COMMIT_LINK - $CLEAN_MSG\n*Author:* $AUTHOR_LINK\n*Branch:* $BRANCH_LINK"

          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"$MESSAGE\"}" \
          ${{ secrets.SLACK_WEBHOOK_NOTIFICATIONS }}
